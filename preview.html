<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Stockholm Day Builder — Live Browser Preview</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & Babel Standalone CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #050508;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-neutral-100 flex justify-center min-h-screen p-0 md:p-6 bg-[#050508]">
  <div id="root" class="w-full max-w-md min-h-screen md:min-h-[844px] md:max-h-[844px] bg-[#090a0f] md:rounded-[40px] md:border md:border-neutral-800 shadow-2xl relative flex flex-col overflow-hidden"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const PLACES = [
      {
        id: 'vasa-museum',
        title: 'The Vasa Museum (Vasamuseet)',
        neighborhood: 'Djurgården',
        category: 'museum',
        costSek: 195,
        costLabel: '195 SEK',
        durationMin: 120,
        isIndoor: true,
        tag: 'Must-See',
        transitTip: 'Ferry 82 from Slussen or Tram 7 (43 SEK tap)',
        mbaNote: 'History’s ultimate case study in scope creep—a 1628 baroque warship raised intact from the Baltic mud.',
        studentDiscountNote: 'No student discount offered (standard 195 SEK rate).',
      },
      {
        id: 'monteliusvagen',
        title: 'Monteliusvägen Cliff Walk',
        neighborhood: 'Södermalm',
        category: 'historic',
        costSek: 0,
        costLabel: 'Free',
        durationMin: 45,
        isIndoor: false,
        tag: 'Scenic Walk',
        transitTip: 'T-Bana Mariatorget (Red Line), walk 5 min',
        mbaNote: 'Panoramic skyline overlooking Lake Mälaren & City Hall. Zero tourist admission fee.',
        studentDiscountNote: '100% Free open public cliff footbridge.',
      },
      {
        id: 'gamla-stan',
        title: 'Gamla Stan Medieval Alleys',
        neighborhood: 'Gamla Stan',
        category: 'historic',
        costSek: 0,
        costLabel: 'Free',
        durationMin: 75,
        isIndoor: false,
        tag: 'Culture',
        transitTip: 'T-Bana Gamla Stan (Direct from T-Centralen)',
        mbaNote: 'Medieval Hanseatic trading nexus from 1252. Explore Stortorget and Mårten Trotzigs Gränd.',
        studentDiscountNote: 'Free open public district; best early morning or at night.',
      },
      {
        id: 'fotografiska',
        title: 'Fotografiska & Harbor Rooftop',
        neighborhood: 'Södermalm',
        category: 'museum',
        costSek: 135,
        costLabel: '135 SEK (Student)',
        durationMin: 90,
        isIndoor: true,
        tag: 'Evening Vibe',
        transitTip: 'T-Bana Slussen, 10 min scenic waterfront walk',
        mbaNote: 'Open late until 23:00. World-class photography with top-floor harbor bar overlooking Djurgården.',
        studentDiscountNote: 'French MBA student ID accepted! Reduced from 195 SEK to 135 SEK.',
      },
      {
        id: 'hobo-urban-escape',
        title: 'Hobo Hotel & Urban Escape Hub',
        neighborhood: 'Norrmalm',
        category: 'tech-mba',
        costSek: 0,
        costLabel: 'Free Entry',
        durationMin: 60,
        isIndoor: true,
        tag: 'Tech & MBA',
        transitTip: 'Brunkebergstorg (T-Centralen / Kungsträdgården)',
        mbaNote: 'Heart of Stockholm’s venture & unicorn district. Startup showcases (SPACEby) & TAK rooftop.',
        studentDiscountNote: 'Open public co-working lounge; grab coffee or just plug in.',
      },
      {
        id: 'vete-katten-fika',
        title: 'Traditional Fika at Vete-Katten',
        neighborhood: 'Norrmalm',
        category: 'eats-fika',
        costSek: 75,
        costLabel: '~75 SEK',
        durationMin: 45,
        isIndoor: true,
        tag: 'Fika Classic',
        transitTip: 'Kungsgatan 55 (3 min walk from T-Centralen)',
        mbaNote: 'Institution since 1928. Cardamom bun + drip coffee with unlimited påtår (free refill).',
        studentDiscountNote: 'Look for the thermal urn near the counter for unlimited refills.',
      },
      {
        id: 'arkdes',
        title: 'ArkDes Architecture & Design',
        neighborhood: 'Skeppsholmen',
        category: 'museum',
        costSek: 0,
        costLabel: '100% Free Entry',
        durationMin: 60,
        isIndoor: true,
        tag: 'Nordic Design',
        transitTip: 'Ferry 82 to Skeppsholmen or footbridge from Kungsträdgården',
        mbaNote: 'Reopened autumn 2024. Swedish spatial innovation and circular timber architecture.',
        studentDiscountNote: 'Completely free admission for all visitors.',
      },
      {
        id: 'tbana-art',
        title: 'Subterranean T-Bana Bedrock Art Tour',
        neighborhood: 'Norrmalm',
        category: 'historic',
        costSek: 43,
        costLabel: '43 SEK',
        durationMin: 60,
        isIndoor: true,
        tag: 'Rain Proof',
        transitTip: 'Blue Line stations: T-Centralen, Stadion, Solna',
        mbaNote: 'World’s longest art gallery in 90+ bedrock metro caverns. Stay warm on a single 75-min fare.',
        studentDiscountNote: 'Standard 43 SEK contactless card tap; valid for 75 minutes of transfers.',
      },
      {
        id: 'swedish-meatballs-budget',
        title: 'Homestyle Meatballs (Husmanskost)',
        neighborhood: 'Norrmalm',
        category: 'eats-fika',
        costSek: 89,
        costLabel: '89–140 SEK',
        durationMin: 50,
        isIndoor: true,
        tag: 'Local Eats',
        transitTip: 'IKEA City Gallerian (Hamngatan) or Mom’s Kitchen',
        mbaNote: 'Skip overpriced tourist dining. Real lingonberries, pressed cucumber, and mash for under 100 SEK.',
        studentDiscountNote: 'IKEA City Gallerian branch serves full plates for 69–89 SEK.',
      },
      {
        id: 'omnipollos-hatt',
        title: 'Omnipollos Hatt Craft Taproom',
        neighborhood: 'Södermalm',
        category: 'nightlife',
        costSek: 95,
        costLabel: '~95 SEK',
        durationMin: 75,
        isIndoor: true,
        tag: 'Craft Beer',
        transitTip: 'Hökens Gata 1A (2 min walk from Slussen metro)',
        mbaNote: 'Famous experimental brewing collective. Unpretentious vibe, sourdough pizza, and lively crowd.',
        studentDiscountNote: 'Casual bar counter walk-ins with no dress code or table cover.',
      }
    ];

    function App() {
      const [places] = useState(PLACES);
      const [dayQueue, setDayQueue] = useState(['vasa-museum', 'fotografiska', 'vete-katten-fika']);
      const [activeCategory, setActiveCategory] = useState('all');
      const [rainMode, setRainMode] = useState(false);
      const [isTrayOpen, setIsTrayOpen] = useState(false);
      const [showSosModal, setShowSosModal] = useState(false);
      const [activeDetailId, setActiveDetailId] = useState(null);

      const toggleQueue = (id) => {
        if (navigator.vibrate) navigator.vibrate(10);
        setDayQueue((prev) => 
          prev.includes(id) ? prev.filter((item) => item !== id) : [...prev, id]
        );
      };

      const filteredPlaces = useMemo(() => {
        return places.filter((place) => {
          if (rainMode && !place.isIndoor) return false;
          if (activeCategory === 'all') return true;
          if (activeCategory === 'free') return place.costSek === 0;
          return place.category === activeCategory;
        });
      }, [places, activeCategory, rainMode]);

      const queuedPlaces = useMemo(() => {
        return dayQueue.map((id) => places.find((p) => p.id === id)).filter(Boolean);
      }, [dayQueue, places]);

      const totalCostSek = useMemo(() => {
        return queuedPlaces.reduce((sum, p) => sum + p.costSek, 0);
      }, [queuedPlaces]);

      const totalDurationMin = useMemo(() => {
        return queuedPlaces.reduce((sum, p) => sum + p.durationMin, 0);
      }, [queuedPlaces]);

      const groupedByIsland = useMemo(() => {
        const groups = {};
        queuedPlaces.forEach((place) => {
          const island = place.neighborhood;
          if (!groups[island]) groups[island] = [];
          groups[island].push(place);
        });
        return groups;
      }, [queuedPlaces]);

      const activeDetailPlace = useMemo(() => {
        return places.find((p) => p.id === activeDetailId);
      }, [places, activeDetailId]);

      return (
        <div className="flex-1 flex flex-col relative overflow-hidden bg-[#090a0f] text-neutral-100">
          {/* Header */}
          <header className="sticky top-0 z-30 bg-[#090a0f]/90 backdrop-blur-md border-b border-neutral-800/80 px-4 py-3 shrink-0">
            <div className="flex items-center justify-between">
              <div>
                <div className="text-[10px] font-mono tracking-widest text-emerald-400 uppercase font-semibold">
                  Stockholm · MBA Guide
                </div>
                <h1 className="text-base font-bold tracking-tight text-neutral-100">
                  Pick Your Day
                </h1>
              </div>
              
              <div className="flex items-center gap-2">
                <button
                  onClick={() => setRainMode(!rainMode)}
                  className={`flex items-center gap-1 px-2.5 py-1.5 rounded-full text-xs font-medium transition-all ${
                    rainMode 
                      ? 'bg-sky-500/20 text-sky-300 border border-sky-500/40 shadow-sm' 
                      : 'bg-neutral-900 text-neutral-400 border border-neutral-800 hover:text-neutral-200'
                  }`}
                >
                  <span>{rainMode ? '🌧️ Rain Mode' : '☀️ Clear'}</span>
                </button>

                <button
                  onClick={() => setShowSosModal(true)}
                  className="px-2.5 py-1.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/30 hover:bg-amber-500/20 text-xs font-mono font-bold flex items-center gap-1"
                >
                  <span>⚠️ SOS</span>
                </button>
              </div>
            </div>

            {/* Filter Pills */}
            <div className="mt-3 flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
              {[
                { id: 'all', label: 'All Sights' },
                { id: 'free', label: 'Free Only' },
                { id: 'museum', label: 'Culture' },
                { id: 'tech-mba', label: 'Tech & MBA' },
                { id: 'eats-fika', label: 'Fika & Eats' },
                { id: 'nightlife', label: 'Nightlife' }
              ].map((cat) => (
                <button
                  key={cat.id}
                  onClick={() => setActiveCategory(cat.id)}
                  className={`px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap transition-colors ${
                    activeCategory === cat.id
                      ? 'bg-neutral-100 text-neutral-950 font-semibold'
                      : 'bg-neutral-900 text-neutral-400 hover:bg-neutral-800 border border-neutral-800'
                  }`}
                >
                  {cat.label}
                </button>
              ))}
            </div>
          </header>

          {/* Places List */}
          <main className="px-4 pt-3 pb-24 space-y-3 flex-1 overflow-y-auto">
            {rainMode && (
              <div className="bg-sky-950/40 border border-sky-800/40 rounded-xl p-3 flex items-start gap-2.5 text-xs text-sky-200">
                <span className="text-base">🌧️</span>
                <div>
                  <span className="font-semibold text-sky-100">Rain & Cold Mode:</span> Outdoor cliff walks hidden; showing warm indoor museums & covered halls.
                </div>
              </div>
            )}

            <div className="text-xs text-neutral-500 font-medium px-1 flex justify-between items-center">
              <span>{filteredPlaces.length} places available</span>
              <span>Tap '+' to add to day</span>
            </div>

            {filteredPlaces.map((place) => {
              const isQueued = dayQueue.includes(place.id);
              return (
                <div
                  key={place.id}
                  className={`rounded-2xl border transition-all p-3.5 ${
                    isQueued 
                      ? 'bg-neutral-900/90 border-emerald-500/40 shadow-sm' 
                      : 'bg-neutral-900/40 border-neutral-800/80 hover:border-neutral-700'
                  }`}
                >
                  <div className="flex items-start justify-between gap-3">
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-1.5 mb-1">
                        <span className="px-2 py-0.5 rounded text-[10px] font-mono tracking-wide uppercase bg-neutral-800 text-neutral-300">
                          {place.neighborhood}
                        </span>
                        <span className="text-[11px] text-neutral-400 font-mono">
                          ⏱️ {place.durationMin}m
                        </span>
                        <span className={`text-[11px] font-mono font-medium ${place.costSek === 0 ? 'text-emerald-400' : 'text-neutral-300'}`}>
                          {place.costLabel}
                        </span>
                      </div>

                      <h3 className="text-sm font-semibold text-neutral-100 leading-snug">
                        {place.title}
                      </h3>

                      <p className="mt-1 text-xs text-neutral-400 leading-relaxed line-clamp-2">
                        {place.mbaNote}
                      </p>

                      <div className="mt-2 flex items-center gap-2">
                        <button
                          onClick={() => setActiveDetailId(place.id)}
                          className="text-[11px] text-neutral-400 hover:text-neutral-200 underline underline-offset-2"
                        >
                          Tips & Transit
                        </button>
                        {place.studentDiscountNote.includes('French') && (
                          <span className="text-[10px] font-mono bg-indigo-950/60 text-indigo-300 px-1.5 py-0.5 rounded border border-indigo-800/40">
                            🎓 French ID OK
                          </span>
                        )}
                      </div>
                    </div>

                    <button
                      onClick={() => toggleQueue(place.id)}
                      className={`w-9 h-9 rounded-xl flex items-center justify-center text-sm font-bold transition-all shrink-0 ${
                        isQueued
                          ? 'bg-emerald-500 text-neutral-950 hover:bg-emerald-400'
                          : 'bg-neutral-800 text-neutral-300 hover:bg-neutral-700 border border-neutral-700'
                      }`}
                    >
                      {isQueued ? '✓' : '+'}
                    </button>
                  </div>
                </div>
              );
            })}
          </main>

          {/* Sticky Bottom Day Tray Dock */}
          <div className="absolute bottom-0 inset-x-0 z-40 p-3 pointer-events-none">
            <button
              onClick={() => setIsTrayOpen(true)}
              className="w-full pointer-events-auto bg-neutral-900/95 hover:bg-neutral-800/95 backdrop-blur-xl border border-neutral-700/80 rounded-2xl p-3 shadow-2xl flex items-center justify-between text-left transition-transform active:scale-[0.99]"
            >
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center justify-center font-bold text-xs">
                  {dayQueue.length}
                </div>
                <div>
                  <div className="text-xs font-semibold text-neutral-100 flex items-center gap-1.5">
                    <span>My Stockholm Day</span>
                    <span className="text-[10px] font-mono px-1.5 py-0.2 rounded bg-neutral-800 text-neutral-300">
                      {Math.round(totalDurationMin / 60 * 10) / 10} hrs
                    </span>
                  </div>
                  <div className="text-[11px] text-neutral-400 font-mono">
                    Spend: {totalCostSek} SEK (~€{Math.round(totalCostSek / 11.2)})
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-1 text-xs font-medium text-emerald-400">
                <span>View Route</span>
                <span className="text-sm">⌃</span>
              </div>
            </button>
          </div>

          {/* Tray Drawer Modal */}
          {isTrayOpen && (
            <div className="absolute inset-0 z-50 bg-black/80 backdrop-blur-sm flex flex-col justify-end">
              <div className="bg-neutral-900 border-t border-neutral-800 rounded-t-3xl w-full max-h-[85%] flex flex-col shadow-2xl">
                <div className="px-5 pt-4 pb-3 border-b border-neutral-800 flex items-center justify-between">
                  <div>
                    <h2 className="text-base font-bold text-neutral-100">
                      Your Day Route Plan
                    </h2>
                    <p className="text-[11px] text-neutral-400">
                      Auto-clustered by island to stop transit backtracking
                    </p>
                  </div>
                  <button
                    onClick={() => setIsTrayOpen(false)}
                    className="w-7 h-7 rounded-full bg-neutral-800 text-neutral-400 flex items-center justify-center hover:text-neutral-100"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-5 overflow-y-auto space-y-5 flex-1">
                  {Object.keys(groupedByIsland).length === 0 ? (
                    <div className="text-center py-8 text-neutral-400 text-xs">
                      No stops queued. Tap '+' on cards to build your day!
                    </div>
                  ) : (
                    Object.entries(groupedByIsland).map(([island, items], index) => (
                      <div key={island} className="space-y-2.5">
                        <div className="flex items-center gap-2">
                          <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                          <h4 className="text-xs font-mono font-bold tracking-wider text-neutral-300 uppercase">
                            Island Hub: {island}
                          </h4>
                          <span className="text-[10px] text-neutral-500 font-mono">
                            ({items.length} {items.length === 1 ? 'spot' : 'spots'})
                          </span>
                        </div>

                        <div className="border-l-2 border-neutral-800 ml-1 pl-4 space-y-2.5">
                          {items.map((place) => (
                            <div 
                              key={place.id}
                              className="bg-neutral-950/60 border border-neutral-800/80 rounded-xl p-3 flex items-start justify-between gap-3"
                            >
                              <div>
                                <div className="text-xs font-semibold text-neutral-200">
                                  {place.title}
                                </div>
                                <div className="text-[11px] text-neutral-400 mt-0.5">
                                  {place.transitTip}
                                </div>
                                <div className="text-[10px] font-mono text-emerald-400 mt-1">
                                  {place.costLabel} · {place.durationMin}m
                                </div>
                              </div>
                              <button
                                onClick={() => toggleQueue(place.id)}
                                className="text-neutral-500 hover:text-rose-400 text-xs p-1"
                              >
                                ✕
                              </button>
                            </div>
                          ))}
                        </div>

                        {index < Object.keys(groupedByIsland).length - 1 && (
                          <div className="py-1 text-center">
                            <span className="inline-block px-2.5 py-0.5 rounded-full text-[10px] font-mono bg-neutral-800/80 text-neutral-400 border border-neutral-700/50">
                              ⛴️ Ferry 82 or Metro to next island (43 SEK tap)
                            </span>
                          </div>
                        )}
                      </div>
                    ))
                  )}

                  {queuedPlaces.length > 0 && (
                    <div className="bg-neutral-950 border border-neutral-800 rounded-2xl p-4 space-y-2">
                      <div className="text-xs font-semibold text-neutral-200">
                        Budget & Transit Summary
                      </div>
                      <div className="grid grid-cols-2 gap-2 text-[11px] font-mono text-neutral-400 pt-1">
                        <div>Activities: <span className="text-neutral-200">{totalCostSek} SEK</span></div>
                        <div>Est. Time: <span className="text-neutral-200">{Math.round(totalDurationMin / 60 * 10) / 10}h</span></div>
                        <div>Transit: <span className="text-neutral-200">{Object.keys(groupedByIsland).length} taps (~{Object.keys(groupedByIsland).length * 43} SEK)</span></div>
                        <div>Total Spend: <span className="text-emerald-400">~€{Math.round((totalCostSek + Object.keys(groupedByIsland).length * 43) / 11.2)}</span></div>
                      </div>
                    </div>
                  )}
                </div>

                <div className="p-4 border-t border-neutral-800 flex gap-2">
                  <button
                    onClick={() => {
                      navigator.clipboard?.writeText(
                        `My Stockholm Day:\n` +
                        queuedPlaces.map((p, i) => `${i + 1}. ${p.title} (${p.neighborhood})`).join('\n') +
                        `\nTotal Spend: ~${totalCostSek} SEK`
                      );
                      alert('Itinerary copied to clipboard!');
                    }}
                    className="flex-1 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-neutral-950 font-semibold text-xs transition-colors"
                  >
                    Copy Route Plan
                  </button>
                  <button
                    onClick={() => setDayQueue([])}
                    className="px-4 py-2.5 rounded-xl bg-neutral-800 hover:bg-neutral-700 text-neutral-300 font-medium text-xs"
                  >
                    Clear
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Detail Modal */}
          {activeDetailPlace && (
            <div className="absolute inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-neutral-800 rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
                <div className="flex items-start justify-between gap-3">
                  <div>
                    <span className="text-[10px] font-mono uppercase px-2 py-0.5 rounded bg-neutral-800 text-neutral-300">
                      {activeDetailPlace.neighborhood} · {activeDetailPlace.tag}
                    </span>
                    <h3 className="text-base font-bold text-neutral-100 mt-1">
                      {activeDetailPlace.title}
                    </h3>
                  </div>
                  <button
                    onClick={() => setActiveDetailId(null)}
                    className="w-7 h-7 rounded-full bg-neutral-800 text-neutral-400 flex items-center justify-center"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-2.5 text-xs leading-relaxed text-neutral-300">
                  <p><strong className="text-neutral-100">Why it matters:</strong> {activeDetailPlace.mbaNote}</p>
                  <p><strong className="text-neutral-100">Transit:</strong> {activeDetailPlace.transitTip}</p>
                  <p><strong className="text-neutral-100">Student & Cost:</strong> {activeDetailPlace.studentDiscountNote}</p>
                </div>

                <div className="pt-2 flex gap-2">
                  <button
                    onClick={() => {
                      toggleQueue(activeDetailPlace.id);
                      setActiveDetailId(null);
                    }}
                    className={`flex-1 py-2 rounded-xl text-xs font-semibold ${
                      dayQueue.includes(activeDetailPlace.id)
                        ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30'
                        : 'bg-emerald-500 text-neutral-950 hover:bg-emerald-400'
                    }`}
                  >
                    {dayQueue.includes(activeDetailPlace.id) ? 'Remove from Day' : '+ Add to Day'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* SOS Modal */}
          {showSosModal && (
            <div className="absolute inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-amber-500/40 rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
                <div className="flex items-start justify-between">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">⚠️</span>
                    <h3 className="text-sm font-bold text-amber-300">
                      Stockholm Transit & Student Rules
                    </h3>
                  </div>
                  <button
                    onClick={() => setShowSosModal(false)}
                    className="w-7 h-7 rounded-full bg-neutral-800 text-neutral-400 flex items-center justify-center"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-3 text-xs leading-relaxed text-neutral-300">
                  <div className="bg-amber-950/40 border border-amber-800/40 p-2.5 rounded-xl">
                    <strong className="text-amber-200 block mb-0.5">Avoid 1,850 SEK Transit Fine:</strong>
                    SL student tickets require a Swedish student card (Mecenat). French IDs do <em>not</em> qualify for public transit discounts.
                    <span className="text-neutral-200 block mt-1 font-mono">
                      → Tap French Visa/Mastercard directly for standard 43 SEK fare (valid 75 min).
                    </span>
                  </div>
